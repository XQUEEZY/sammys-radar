name: Atualizar notícias do Radar

on:
  schedule:
    - cron: '*/10 * * * *'   # o GitHub pode atrasar alguns minutos em horário de pico
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q -r requirements.txt
      - run: python radar.py
      - name: Salva o news.json
        run: |
          if ! git diff --quiet docs/news.json; then
            git config user.name "XQUEEZY"; git config user.email "94566095+XQUEEZY@users.noreply.github.com"
            git add docs/news.json; git commit -q -m "notícias atualizadas"
            git pull -q --rebase && git push -q
          fi
