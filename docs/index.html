<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAMMY'S Radar</title>
<style>
  :root{
    --bg:#0b0d14; --panel:#12151f; --panel2:#171b28; --border:#242a3a;
    --text:#e8eaf2; --sub:#8a90a6; --accent:#7c5cff; --accent2:#ff5c8a;
    --ok:#2fbf6e;
    --cat-jogos:#4f9dff; --cat-filmes:#ff8a4f; --cat-animes:#ff5c8a; --cat-geral:#7c5cff;
    --lang-pt:#2fbf6e; --lang-en:#ffc93c;
  }
  *{box-sizing:border-box;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--text); font-family:"Segoe UI",Arial,sans-serif;}
  a{color:inherit;}

  header{position:sticky; top:0; z-index:5; background:rgba(11,13,20,0.9); backdrop-filter:blur(8px); border-bottom:1px solid var(--border); padding:14px 20px;}
  .header-row{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; max-width:1100px; margin:0 auto;}
  .brand{display:flex; align-items:center; gap:10px; font-weight:800; font-size:20px;}
  .brand .dot{width:10px; height:10px; border-radius:50%; background:var(--ok); box-shadow:0 0 8px var(--ok);}
  .brand .dot.off{background:#666; box-shadow:none;}
  .status{font-size:12px; color:var(--sub);}

  .filters{display:flex; align-items:center; gap:8px; flex-wrap:wrap; max-width:1100px; margin:12px auto 0; padding:0 20px;}
  .filters .label{font-size:11px; color:var(--sub); text-transform:uppercase; letter-spacing:.05em; margin-right:2px;}
  .filters button{background:var(--panel); border:1px solid var(--border); color:var(--sub); padding:6px 14px; border-radius:999px; font-size:13px; cursor:pointer; transition:.15s;}
  .filters button:hover{color:var(--text); border-color:var(--accent);}
  .filters button.active{background:var(--accent); color:#fff; border-color:var(--accent);}
  .filters.lang-filters button.active[data-lang="pt"]{background:var(--lang-pt); border-color:var(--lang-pt);}
  .filters.lang-filters button.active[data-lang="en"]{background:var(--lang-en); border-color:var(--lang-en); color:#0b0d14;}

  main{max-width:1100px; margin:20px auto; padding:0 20px 60px;}
  .grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); gap:14px;}

  .card{background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:16px; display:flex; flex-direction:column; gap:8px; text-decoration:none; transition:.15s;}
  .card:hover{border-color:var(--accent); transform:translateY(-2px);}
  .card.new{animation:pop .6s ease; border-color:var(--accent2); box-shadow:0 0 0 1px var(--accent2);}
  @keyframes pop{0%{box-shadow:0 0 0 6px rgba(255,92,138,0.35);}100%{box-shadow:none;}}

  .card-top{display:flex; justify-content:space-between; align-items:center; gap:8px;}
  .badges{display:flex; align-items:center; gap:6px;}
  .badge{font-size:11px; font-weight:700; padding:3px 9px; border-radius:999px; color:#0b0d14;}
  .lang-tag{font-size:10px; font-weight:700; padding:3px 8px; border-radius:999px; border:1px solid var(--border); color:var(--sub);}
  .lang-tag.pt{color:var(--lang-pt); border-color:var(--lang-pt);}
  .lang-tag.en{color:var(--lang-en); border-color:var(--lang-en);}
  .time{font-size:11px; color:var(--sub);}

  .card h3{margin:0; font-size:16px; line-height:1.35;}
  .card .summary{font-size:13px; color:var(--sub); line-height:1.4; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden;}
  .source{font-size:12px; color:var(--accent); font-weight:600; margin-top:auto;}

  .empty{color:var(--sub); text-align:center; padding:60px 20px;}

  .sound-toggle{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--sub); cursor:pointer; user-select:none;}
  .sound-toggle input{accent-color:var(--accent);}

  footer{text-align:center; color:var(--sub); font-size:12px; padding:20px; opacity:.7;}
</style>
</head>
<body>

<header>
  <div class="header-row">
    <div class="brand"><span class="dot" id="liveDot"></span> SAMMY'S Radar</div>
    <div style="display:flex; align-items:center; gap:16px;">
      <label class="sound-toggle"><input type="checkbox" id="soundToggle" checked> som</label>
      <label class="sound-toggle"><input type="checkbox" id="notifToggle"> notificação do navegador</label>
      <div class="status" id="statusText">conectando...</div>
    </div>
  </div>
  <div class="filters" id="filters">
    <span class="label">Categoria</span>
    <button data-cat="all" class="active">Todos</button>
    <button data-cat="Filmes/Séries">Filmes/Séries</button>
    <button data-cat="Jogos">Jogos</button>
    <button data-cat="Animes">Animes</button>
    <button data-cat="Geral">Geral</button>
  </div>
  <div class="filters lang-filters" id="langFilters">
    <span class="label">Idioma</span>
    <button data-lang="all" class="active">Todos</button>
    <button data-lang="pt">Português</button>
    <button data-lang="en">Inglês</button>
  </div>
</header>

<main>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none;">Nenhuma notícia ainda. Aguardando os sites atualizarem...</div>
</main>

<footer id="sourcesFooter"></footer>

<script>
const grid = document.getElementById('grid');
const empty = document.getElementById('empty');
const statusText = document.getElementById('statusText');
const liveDot = document.getElementById('liveDot');
const soundToggle = document.getElementById('soundToggle');
const notifToggle = document.getElementById('notifToggle');
const sourcesFooter = document.getElementById('sourcesFooter');

let items = [];
let currentFilter = 'all';
let currentLang = 'all';
let unread = 0;
const baseTitle = document.title;

function beep(){
  if(!soundToggle.checked) return;
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(880, ctx.currentTime);
    o.frequency.setValueAtTime(660, ctx.currentTime + 0.12);
    g.gain.setValueAtTime(0.15, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
    o.connect(g); g.connect(ctx.destination);
    o.start(); o.stop(ctx.currentTime + 0.35);
  }catch(e){}
}

function fmtTime(iso){
  const d = new Date(iso);
  return d.toLocaleString('pt-BR', {day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'});
}

const CAT_COLORS = {
  'Jogos': 'var(--cat-jogos)',
  'Filmes/Séries': 'var(--cat-filmes)',
  'Animes': 'var(--cat-animes)',
  'Geral': 'var(--cat-geral)',
};

const LANG_LABEL = { pt: 'Português', en: 'Inglês' };

function matchesFilter(item){
  const catOk = currentFilter === 'all' || item.category === currentFilter;
  const langOk = currentLang === 'all' || item.lang === currentLang;
  return catOk && langOk;
}

function makeCard(item, isNew){
  const a = document.createElement('a');
  a.href = item.link;
  a.target = '_blank';
  a.rel = 'noopener noreferrer';
  a.className = 'card' + (isNew ? ' new' : '');
  a.dataset.cat = item.category;
  a.dataset.lang = item.lang;
  const badgeColor = CAT_COLORS[item.category] || 'var(--cat-geral)';
  const langLabel = LANG_LABEL[item.lang] || item.lang;
  a.innerHTML = `
    <div class="card-top">
      <div class="badges">
        <span class="badge" style="background:${badgeColor}">${item.category}</span>
        <span class="lang-tag ${item.lang}">${langLabel}</span>
      </div>
      <span class="time">${fmtTime(item.published)}</span>
    </div>
    <h3>${item.title}</h3>
    <div class="summary">${(item.summary || '').replace(/<[^>]*>/g, '')}</div>
    <div class="source">${item.source}</div>
  `;
  if(!matchesFilter(item)){
    a.style.display = 'none';
  }
  return a;
}

function render(){
  grid.innerHTML = '';
  const filtered = items.filter(matchesFilter);
  empty.style.display = filtered.length ? 'none' : 'block';
  filtered.forEach(item => grid.appendChild(makeCard(item, false)));
}

function prependNew(item){
  items.unshift(item);
  if(matchesFilter(item)){
    empty.style.display = 'none';
    grid.prepend(makeCard(item, true));
  }
}

document.getElementById('filters').addEventListener('click', (e) => {
  const btn = e.target.closest('button');
  if(!btn) return;
  document.querySelectorAll('#filters button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentFilter = btn.dataset.cat;
  render();
});

document.getElementById('langFilters').addEventListener('click', (e) => {
  const btn = e.target.closest('button');
  if(!btn) return;
  document.querySelectorAll('#langFilters button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentLang = btn.dataset.lang;
  render();
});

notifToggle.addEventListener('change', () => {
  if(notifToggle.checked && Notification.permission !== 'granted'){
    Notification.requestPermission().then(p => {
      if(p !== 'granted') notifToggle.checked = false;
    });
  }
});

function notify(item){
  beep();
  unread += 1;
  document.title = `(${unread}) ${baseTitle}`;
  if(notifToggle.checked && Notification.permission === 'granted'){
    const n = new Notification(`${item.source}: ${item.category}`, {
      body: item.title,
      tag: item.id,
    });
    n.onclick = () => { window.open(item.link, '_blank'); n.close(); };
  }
}

window.addEventListener('focus', () => {
  unread = 0;
  document.title = baseTitle;
});

// Versão online: o GitHub Actions atualiza news.json a cada ~10 min e o painel
// confere o arquivo a cada minuto; o que não estava na tela vira novidade e apita.
const CHECK_EVERY_MS = 60 * 1000;
let knownIds = new Set();

async function fetchNews(){
  const res = await fetch('news.json?t=' + Date.now(), {cache: 'no-store'});
  if(!res.ok) throw new Error(res.status);
  return res.json();
}

function setStatus(data){
  liveDot.classList.remove('off');
  statusText.textContent = data.last_check ? `online — última checagem dos sites: ${fmtTime(data.last_check)}` : 'aguardando...';
}

async function loadInitial(){
  const data = await fetchNews();
  items = data.items || [];
  knownIds = new Set(items.map(i => i.id));
  render();
  setStatus(data);
  sourcesFooter.textContent = 'Monitorando: ' + (data.sources || []).join(' · ');
}

async function checkUpdates(){
  try{
    const data = await fetchNews();
    const novos = (data.items || []).filter(i => !knownIds.has(i.id));
    novos.sort((a, b) => a.published.localeCompare(b.published));  // o mais recente fica no topo
    novos.forEach(item => { knownIds.add(item.id); prependNew(item); notify(item); });
    setStatus(data);
  }catch(e){
    liveDot.classList.add('off');
    statusText.textContent = 'sem conexão, tentando de novo...';
  }
}

loadInitial().catch(() => { statusText.textContent = 'erro ao carregar as notícias'; })
  .finally(() => setInterval(checkUpdates, CHECK_EVERY_MS));
</script>
</body>
</html>
